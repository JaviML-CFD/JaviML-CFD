name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Target profile
          user: JaviML-CFD
          config_timezone: Europe/Rome
          
          # 🛠️ STRIP AWAY ALL THE DEFAULT MASSIVE TEXT WALLS
          base: "" # This completely deletes the header, activity, and community text blocks!
          
          # 🏎️ ONLY ENABLE THE RELEVANT LANGUAGE METRICS
          plugin_languages: yes
          plugin_languages_ignored: html, css # Ignores non-engineering languages if they ever appear
          plugin_languages_details: percentage # Shows cleanly just the name and percentage
          plugin_languages_sections: most-used
          plugin_languages_indepth: no
          plugin_languages_limit: 4